<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inicio de Sesión - Administración</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: url('Diseño-de-mesas-modernas.jpeg') no-repeat center center fixed;
      background-size: cover;
      position: relative;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Capa semi-transparente encima de la imagen */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); /* oscurece la imagen */
      z-index: 0;
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 380px;
      border-radius: 12px;
      overflow: hidden;
      opacity: 0; /* invisible al inicio */
      transform: translateY(20px);
      animation: fadeInUp 3s forwards; /* animación */
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-card .card-header {
      background: #fff;
      text-align: center;
      padding: 20px;
    }
    .login-card .card-header h3 {
      margin: 0;
      font-weight: 600;
      color: #0d6efd;
    }
    .login-card .card-body {
      background: #f8f9fa;
      padding: 25px;
    }
    .btn-custom {
      background: #0d6efd;
      border: none;
      transition: 0.3s;
    }
    .btn-custom:hover {
      background: #0b5ed7;
    }
  </style>
</head>
<body>

  <div class="card shadow login-card">
    <div class="card-header">
      <h3>Restaurante ????</h3>
    </div>
    <div class="card-body">
        <form action="cuenta.html" method="post">
        <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="abc" name="abc" placeholder="Ingresa tu usuario" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="123" name="123" placeholder="Ingresa tu contraseña" required>
        </div>
        <button type="submit" class="btn btn-custom w-100">Ingresar</button>
        </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
