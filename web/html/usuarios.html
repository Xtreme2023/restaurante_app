<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Usuarios - Administración</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f4f4;
    }
    .tabla-container {
      max-width: 900px;
      margin: 50px auto;
    }
  </style>
</head>
<body>

  <!-- Navbar superior -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Sistema</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="cuenta.html">Mi Cuenta</a></li>
          <li class="nav-item"><a class="nav-link" href="menu.html">Crear Menu</a></li>
          <li class="nav-item"><a class="nav-link" href="reportes.html">Reportes</a></li>
          <li class="nav-item"><a class="nav-link active" href="usuarios.html">Usuarios</a></li>
           <li class="nav-item"><a class="nav-link active" href="InicioSesion.html">Cerrar Sesion</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Botón fuera de la tabla -->
  <div class="container tabla-container mb-3">
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#nuevoEmpleadoModal">
      Agregar Nuevo Empleado
    </button>
  </div>

  <!-- Contenido centrado con tabla -->
  <div class="container tabla-container">
    <div class="card shadow">
      <div class="card-header bg-primary text-white text-center">
        <h4>Listado de Empleados</h4>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-primary">
              <tr>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="empleadosTable">
              <tr>
                <td>Juan</td>
                <td>Pérez</td>
                <td>71234567</td>
                <td>juan.perez@empresa.com</td>
                <td>
                  <button class="btn btn-info btn-sm">Detalles</button>
                  <button class="btn btn-secondary btn-sm">Informe</button>
                  <button class="btn btn-danger btn-sm">Anular acceso</button>
                </td>
              </tr>
              <tr>
                <td>María</td>
                <td>Gonzales</td>
                <td>78901234</td>
                <td>maria.gonzales@empresa.com</td>
                <td>
                  <button class="btn btn-info btn-sm">Detalles</button>
                  <button class="btn btn-secondary btn-sm">Informe</button>
                  <button class="btn btn-danger btn-sm">Anular acceso</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para agregar nuevo empleado -->
  <div class="modal fade" id="nuevoEmpleadoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Agregar Nuevo Empleado</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="nuevoEmpleadoForm">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" required>
            </div>
            <div class="mb-3">
              <label for="apellidos" class="form-label">Apellidos</label>
              <input type="text" class="form-control" id="apellidos" required>
            </div>
            <div class="mb-3">
              <label for="telefono" class="form-label">Teléfono</label>
              <input type="text" class="form-control" id="telefono" required>
            </div>
            <div class="mb-3">
              <label for="correo" class="form-label">Correo</label>
              <input type="email" class="form-control" id="correo" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Guardar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script para agregar empleado dinámicamente -->
  <script>
    document.getElementById('nuevoEmpleadoForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const nombre = document.getElementById('nombre').value;
      const apellidos = document.getElementById('apellidos').value;
      const telefono = document.getElementById('telefono').value;
      const correo = document.getElementById('correo').value;

      const nuevaFila = `
        <tr>
          <td>${nombre}</td>
          <td>${apellidos}</td>
          <td>${telefono}</td>
          <td>${correo}</td>
          <td>
            <button class="btn btn-info btn-sm">Detalles</button>
            <button class="btn btn-secondary btn-sm">Informe</button>
            <button class="btn btn-danger btn-sm">Anular acceso</button>
          </td>
        </tr>
      `;

      document.getElementById('empleadosTable').insertAdjacentHTML('beforeend', nuevaFila);

      const modal = bootstrap.Modal.getInstance(document.getElementById('nuevoEmpleadoModal'));
      modal.hide();
      e.target.reset();
    });
  </script>
</body>
</html>
