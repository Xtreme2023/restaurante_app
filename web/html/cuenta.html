<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Cuenta - Administración</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f4f4;
    }
    .cuenta-container {
      max-width: 600px; /* más pequeño y centrado */
      margin: 50px auto;
    }
  </style>
</head>
<body>

  <!-- Navbar superior -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Sistema</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="cuenta.html">Mi Cuenta</a></li>
        
          <li class="nav-item"><a class="nav-link" href="menu.html">Crear Menu</a></li>
          <li class="nav-item"><a class="nav-link" href="reportes.html">Reportes</a></li>
          <li class="nav-item"><a class="nav-link" href="usuarios.html">usuarios</a></li>
          <li class="nav-item"><a class="nav-link active" href="InicioSesion.html">Cerrar Sesion</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido centrado -->
  <div class="container cuenta-container">
    <div class="card shadow">
      <div class="card-header bg-primary text-white text-center">
        <h4>Mi Cuenta</h4>
      </div>
      <div class="card-body">
        <form>
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre completo</label>
            <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre">
          </div>
          <div class="mb-3">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Nueva contraseña</label>
            <input type="password" class="form-control" id="password" placeholder="********">
          </div>
          <div class="mb-3">
            <label for="notificaciones" class="form-label">Notificaciones</label>
            <select id="notificaciones" class="form-select">
              <option value="on">Activadas</option>
              <option value="off">Desactivadas</option>
            </select>
          </div>
          <button type="submit" class="btn btn-success w-100">Guardar cambios</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
